name: Deploy Virtual Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build professional ONPG worksheet PDF
        run: |
          python -m pip install --disable-pip-version-check weasyprint==68.0
          python - <<'PY'
          from weasyprint import HTML
          HTML(filename="labs/onpg/ONPG_Virtual_Lab_Worksheet.html").write_pdf(
              "labs/onpg/ONPG_Virtual_Lab_Worksheet.pdf"
          )
          PY

      - name: Build updated heat-transfer worksheet
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python labs/parallel-heat-transfer/build_worksheet.py
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer
          fi
          rm -f labs/parallel-heat-transfer/Parallel_Heat_Transfer_Worksheet.pdf
          rm -f labs/parallel-heat-transfer/Panel_Heat_Transfer_Worksheet.pdf
          timeout 90s libreoffice --headless --convert-to pdf --outdir labs/parallel-heat-transfer labs/parallel-heat-transfer/Parallel_Heat_Transfer_Worksheet.docx
          cp labs/parallel-heat-transfer/Parallel_Heat_Transfer_Worksheet.pdf labs/parallel-heat-transfer/Panel_Heat_Transfer_Worksheet.pdf
          test -s labs/parallel-heat-transfer/Parallel_Heat_Transfer_Worksheet.pdf

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
