name: Deploy Virtual Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify reviewed ONPG worksheet artifacts
        run: |
          test -s labs/onpg/ONPG_Virtual_Lab_Worksheet.pdf
          test -s labs/onpg/ONPG_Virtual_Lab_Worksheet.docx

      - name: Build exact heat-transfer worksheet
        run: |
          python labs/parallel-heat-transfer/build_worksheet.py
          test -s "labs/parallel-heat-transfer/Heat Transfer Worksheet.docx"
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer
          fi
          rm -rf /tmp/heat-transfer-pdf
          mkdir -p /tmp/heat-transfer-pdf
          timeout 90s libreoffice --headless --convert-to pdf --outdir /tmp/heat-transfer-pdf "labs/parallel-heat-transfer/Heat Transfer Worksheet.docx"
          cp "/tmp/heat-transfer-pdf/Heat Transfer Worksheet.pdf" "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf"
          cp "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf" labs/parallel-heat-transfer/Parallel_Heat_Transfer_Worksheet.pdf
          cp "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf" labs/parallel-heat-transfer/Panel_Heat_Transfer_Worksheet.pdf
          test -s "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf"

      - name: Generate updated ONPG Worksheet
        run: |
          python -m pip install -q python-docx Pillow
          python labs/onpg/build_worksheet.py
          test -s labs/onpg/Worksheet.docx
          mkdir -p /tmp/onpg-worksheet-export
          timeout 90s libreoffice -env:UserInstallation=file:///tmp/lo-onpg-worksheet --headless --convert-to pdf --outdir /tmp/onpg-worksheet-export labs/onpg/Worksheet.docx
          cp /tmp/onpg-worksheet-export/Worksheet.pdf labs/onpg/Worksheet.pdf
          test -s labs/onpg/Worksheet.pdf
          python - <<'PY'
          from docx import Document
          d=Document('labs/onpg/Worksheet.docx')
          body="\n".join(p.text for p in d.paragraphs)
          assert "eight-step" not in body.lower()
          assert "39.8" in body
          assert len(d.element.body.xpath('.//m:oMath')) >= 3
          print("ONPG Worksheet math and model checks passed")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
