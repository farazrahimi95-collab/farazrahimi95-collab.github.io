name: Deploy Virtual Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify reviewed ONPG worksheet artifacts
        run: |
          test -s labs/onpg/ONPG_Virtual_Lab_Worksheet.pdf
          test -s labs/onpg/ONPG_Virtual_Lab_Worksheet.docx

      - name: Build exact heat-transfer worksheet
        run: |
          python labs/parallel-heat-transfer/build_worksheet.py
          test -s "labs/parallel-heat-transfer/Heat Transfer Worksheet.docx"
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer
          fi
          rm -rf /tmp/heat-transfer-pdf
          mkdir -p /tmp/heat-transfer-pdf
          timeout 90s libreoffice --headless --convert-to pdf --outdir /tmp/heat-transfer-pdf "labs/parallel-heat-transfer/Heat Transfer Worksheet.docx"
          cp "/tmp/heat-transfer-pdf/Heat Transfer Worksheet.pdf" "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf"
          cp "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf" labs/parallel-heat-transfer/Parallel_Heat_Transfer_Worksheet.pdf
          cp "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf" labs/parallel-heat-transfer/Panel_Heat_Transfer_Worksheet.pdf
          test -s "labs/parallel-heat-transfer/Heat Transfer Worksheet.pdf"

      - name: Verify reviewed Worksheet files
        run: |
          test -s labs/onpg/Worksheet.docx
          test -s labs/onpg/Worksheet.pdf
          python -m pip install -q python-docx
          python - <<'PY'
          from docx import Document
          doc=Document('labs/onpg/Worksheet.docx')
          text="\n".join(p.text for p in doc.paragraphs)
          assert "39.8" in text
          assert len(doc.element.body.xpath('.//m:oMath')) >= 10
          assert len(doc.tables) >= 5
          print("Reviewed Worksheet.docx and Worksheet.pdf published unchanged")
          PY

      - name: Reorder the reviewed ONPG Worksheet to match Stages 1–6
        run: |
          python labs/onpg/reorder_worksheet.py
          python labs/onpg/format_homework_questions.py
          python labs/onpg/align_seven_rate_homework.py
          mkdir -p /tmp/onpg-reordered-pdf
          timeout 90s libreoffice -env:UserInstallation=file:///tmp/lo-onpg-reorder --headless --convert-to pdf --outdir /tmp/onpg-reordered-pdf labs/onpg/Worksheet.docx
          cp /tmp/onpg-reordered-pdf/Worksheet.pdf labs/onpg/Worksheet.pdf
          test -s labs/onpg/Worksheet.docx
          test -s labs/onpg/Worksheet.pdf
          python - <<'PY'
          from docx import Document
          d=Document('labs/onpg/Worksheet.docx')
          t='\n'.join(p.text for p in d.paragraphs)
          # The student-facing order must agree with the SIX stages on the website.
          stage_markers = [
              'Experiment 1: Free-Enzyme Kinetics (Stage 1)',
              'Experiment 1: Michaelis–Menten Analysis (Stage 2)',
              'Experiment 2: Bead-Diameter Design (Stage 3)',
              'Open Stage 4 (2.8 mm beads)',
              'Continue to Stage 5 (4.6 mm beads)',
              'Open Stage 6 to compare',
          ]
          assert all(marker in t for marker in stage_markers), 'One or more worksheet stages missing'
          assert [t.index(marker) for marker in stage_markers] == sorted(t.index(marker) for marker in stage_markers), 'Worksheet stage order differs from website'
          assert t.index('Experiment 1: Free-Enzyme') < t.index('Experiment 2: Bead-Diameter') < t.index('Experiment 3: Compare')
          assert t.count('Homework Questions') == 1
          assert 'Homework 1:' not in t and 'Homework 2:' not in t
          for number in range(1, 5):
              assert t.count(f'Question {number}.') == 1
          assert t.index('Question 1.') < t.index('Question 2.') < t.index('Question 3.') < t.index('Question 4.')
          assert 'Using all seven Stage 1 initial rates (0.622–39.8 mM)' in t
          assert 'Exclude the simulated 39.8' not in t
          assert len(d.tables)==5
          print('Reviewed Word equations, tables, and reordered section references.')
          PY

      # Publish both historical worksheet URLs with the SAME reviewed, staged-order
      # document. Older links must never show the obsolete 10-page worksheet.
      - name: Synchronize ONPG worksheet URLs
        run: |
          cp labs/onpg/Worksheet.pdf labs/onpg/ONPG_Virtual_Lab_Worksheet.pdf
          cp labs/onpg/Worksheet.docx labs/onpg/ONPG_Virtual_Lab_Worksheet.docx
          cmp labs/onpg/Worksheet.pdf labs/onpg/ONPG_Virtual_Lab_Worksheet.pdf
          cmp labs/onpg/Worksheet.docx labs/onpg/ONPG_Virtual_Lab_Worksheet.docx

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
